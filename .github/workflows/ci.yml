name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile release executable
        run: swift build -c release
      - name: Check shell syntax
        run: |
          for script in Scripts/*.sh Distribution/*.sh; do bash -n "$script"; done
      - name: Gesture regressions
        run: bash Scripts/test-core.sh
      - name: Custom shortcut regressions
        run: bash Scripts/test-shortcuts.sh
      - name: Compile shortcut recorder fixture
        run: bash Scripts/test-shortcut-recorder.sh .test-build/shortcut-recorder --compile-only
      - name: Session and diagnostics regressions
        run: bash Scripts/test-session.sh
      - name: Settings and login-state regressions
        run: bash Scripts/test-settings.sh
      - name: Listener recovery and permission diagnostics
        run: bash Scripts/test-permissions.sh
      - name: Custom words and request hints
        run: |
          bash Scripts/test-vocabulary.sh
          bash Scripts/test-vocabulary-worker.sh
          mkdir -p .test-build
          curl -fL --retry 2 https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v1.8.3.tar.gz -o .test-build/whisper-v1.8.3.tar.gz
          echo "870ba21409cdf66697dc4db15ebdb13bc67037d76c7cc63756c81471d8f1731a  .test-build/whisper-v1.8.3.tar.gz" | shasum -a 256 -c -
          tar -xzf .test-build/whisper-v1.8.3.tar.gz -C .test-build
          bash Scripts/test-native-vocabulary-worker.sh .test-build/whisper.cpp-1.8.3
      - name: External models and native install transaction
        run: bash Scripts/test-runtime-setup.sh
      - name: Target inspection cancellation regressions
        run: bash Scripts/test-target-inspector.sh
      - name: Original destination restoration
        run: bash Scripts/test-destination-restoration.sh
      - name: Cleanup regressions
        run: |
          bash Scripts/test-cleanup.sh
          bash Scripts/test-cleanup-coordinator.sh
      - name: Owned correction cache regressions
        run: bash Scripts/test-cleanup-service.sh
      - name: Correction lifecycle regressions
        run: bash Scripts/test-correction-lifecycle.sh
      - name: Compile floating indicator fixture
        run: bash Scripts/test-hud.sh .test-build/hud --compile-only
      - name: Audio recovery regressions
        run: |
          bash Scripts/test-audio.sh
          bash Scripts/test-native-audio.sh
      - name: Cancellation regressions
        run: bash Scripts/test-transcriber.sh
      - name: Worker fault regressions
        run: bash Scripts/test-worker-faults.sh
      - name: Compile synthetic model benchmark
        run: |
          mkdir -p .test-build/upgrade-benchmark/ModuleCache
          swiftc -O -swift-version 5 -parse-as-library \
            -module-cache-path .test-build/upgrade-benchmark/ModuleCache \
            Sources/DictationCore/Vocabulary.swift Sources/DictationCore/RecordingPolicy.swift \
            Sources/LocalDictation/WhisperTranscriber.swift Sources/LocalDictation/CleanupClient.swift \
            Sources/LocalDictation/CleanupCoordinator.swift Sources/LocalDictation/LocalCorrectionService.swift \
            Tests/UpgradeModelBenchmark.swift -framework AVFoundation \
            -o .test-build/upgrade-benchmark/upgrade-model-benchmark
          python3 Scripts/generate-upgrade-fixtures.py --validate-only
      - name: Packaging and installer rollback regressions
        run: |
          python3 Tests/PackagingSmoke.py
          python3 Tests/ThinReleaseSmoke.py
          python3 Tests/RealSigningSmoke.py
          python3 Tests/InstallerSmoke.py
